name: Synthetic Checks

# Runs against the LIVE production site — separate from the Tests workflow,
# which only runs against code in CI. This catches things unit tests can't:
# a bad Vercel env var, a DNS problem, Supabase being unreachable from
# production specifically, etc. Runs a few times a day plus after every
# deploy to main.
on:
  schedule:
    - cron: '15 */6 * * *' # every 6 hours
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  SITE_URL: https://battle-room.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage loads
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/")
          echo "Status: $status"
          test "$status" = "200"

      - name: Health check reports OK
        run: |
          body=$(curl -s "$SITE_URL/api/health")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Signup page loads
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/signup")
          test "$status" = "200"

      - name: Admin login page loads
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/admin")
          test "$status" = "200"

      - name: Creator app page loads
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/app")
          test "$status" = "200"

      - name: Public stats endpoint returns valid JSON
        run: |
          curl -sf "$SITE_URL/api/public-stats" | python3 -m json.tool > /dev/null

      - name: Stripe webhook endpoint is alive (expects a rejected signature, not a crash)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SITE_URL/api/webhooks/stripe" -d '{}')
          echo "Status: $status"
          # 400 = signature correctly rejected (healthy). 500/502/503 = actually broken.
          test "$status" = "400"

      - name: Notify on failure
        if: failure()
        run: echo "::error::One or more synthetic checks failed against $SITE_URL — see the failed step above for which one."
